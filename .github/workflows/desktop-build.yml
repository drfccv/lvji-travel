name: Build desktop installers

on:
  push:
    branches:
      - drfccv/electron-local
    tags:
      - "v*"
  pull_request:
    branches:
      - drfccv/electron-local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm desktop:test

  package:
    name: Package ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
            builder_args: --win nsis portable --x64
            artifact_name: lvji-windows-x64
            artifact_paths: |
              release/*.exe
              release/*.exe.blockmap
          - name: macOS Intel
            os: macos-latest
            arch: x64
            builder_args: --mac dmg --x64
            artifact_name: lvji-macos-x64
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
          - name: macOS Apple Silicon
            os: macos-latest
            arch: arm64
            builder_args: --mac dmg --arm64
            artifact_name: lvji-macos-arm64
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
          # Built on the oldest still-supported Ubuntu LTS so the bundled
          # better-sqlite3 native module and the Electron binary link against
          # an old enough glibc to run on all supported distributions.
          - name: Linux x64
            os: ubuntu-22.04
            arch: x64
            builder_args: --linux AppImage deb --x64
            artifact_name: lvji-linux-x64
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e 'const fs=require("fs");const v=process.env.GITHUB_REF_NAME.replace(/^v/,"");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=v;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");console.log("package.json version -> "+v)'
      - name: Rebuild SQLite for Electron
        if: runner.os != 'Linux'
        run: pnpm exec electron-rebuild -f -w better-sqlite3 --arch=${{ matrix.arch }}
      # Electron 43's V8 headers defeat both of ubuntu-22.04's default compilers:
      # v8-primitive.h mixes a C++11 attribute with a GNU one (rejected by GCC <= 12),
      # and v8-source-location.h needs a builtin that clang <= 15 lacks. clang 18
      # handles both, and links the system libstdc++-11, so glibc/GLIBCXX stay old.
      - name: Rebuild SQLite for Electron (Linux, clang 18)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18
          CC=clang-18 CXX=clang++-18 \
            pnpm exec electron-rebuild -f -w better-sqlite3 --arch=${{ matrix.arch }}
      - run: pnpm desktop:build
      - name: Build installer
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  # Publishing from CI instead of uploading by hand guarantees the binaries
  # match the tagged commit and removes the manual step entirely.
  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: List release assets
        run: find dist-artifacts -type f | sort
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
